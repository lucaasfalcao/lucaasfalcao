# Gera o calendário 3D das contribuições (profile-3d-contrib/*.svg) todo dia.
name: Calendário 3D de contribuições

on:
  schedule:
    - cron: "0 9 * * *"   # 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A ferramenta não tem opção para ocultar linguagens: baixa a v0.9.3 e tira
      # Shell e PowerShell do gráfico de linguagens (os commits entram em "other").
      - uses: actions/checkout@v4
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: v0.9.3
          path: .profile-3d-contrib-action
      - name: Oculta Shell e PowerShell
        run: |
          sed -i "s/\.filter((repo) => repo\.repository\.primaryLanguage)/.filter((repo) => repo.repository.primaryLanguage \&\& !['Shell', 'PowerShell'].includes(repo.repository.primaryLanguage.name))/" .profile-3d-contrib-action/dist/index.js
          grep -q "'Shell', 'PowerShell'" .profile-3d-contrib-action/dist/index.js
      - uses: ./.profile-3d-contrib-action
        env:
          # Token pessoal (repo + read:user) para incluir os repositórios privados
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Atualiza calendário 3D de contribuições"
          git push
